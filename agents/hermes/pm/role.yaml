# Hermes agent role manifest.  Tracked in the PROJECT repository.
# The agent's actual state (memory, sessions, evolving SOUL) lives in the
# runtime submodule.  This file is the immutable contract for this role.

repo: bloodbank
role: pm
agent_id: bloodbank-pm
display_name: "Bloodbank PM"
purpose: "Triage incoming Bloodbank work, plan event-schema rollouts, route PRs to dev and review agents"

# Inference target (empty = inherit from global ~/.hermes/config.yaml)
model:
  provider: ""
  name: ""

# Hermes profile name. Profile dir is symlinked into ./runtime/.
profile: bloodbank-pm

# Telegram bot identity (one bot per agent — see docs/architecture.md).
telegram:
  bot_username: "bloodbank_pm_bot"

# Email address (Cloudflare Email Routing on delo.sh).
email:
  address: "bloodbank-pm@delo.sh"
  forward_to: "jaradd@gmail.com"

# Plane project (1:1 with this agent).
plane:
  workspace: "33god"
  project_id: "10d06f8d-c110-4ce5-beaa-0914534b090a"
  identifier: "BB"
# Ticket-provider binding (linear | plane | trello). Board/workspace come from
# repo-root .project.json; this block supplies the normalized-state -> Plane
# lane map, which is REQUIRED on this board: Plane's `started` group holds 4
# lanes and `unstarted` holds 2, so the adapter refuses to guess and every
# transition fails until each band is named here.
ticket_provider:
  name: plane
  backlog:   "Backlog"
  unstarted: "Todo"
  started:   "In Progress"
  in_review: "In Progress"   # Krebs lifecycle v2: no review lane; review = In Progress + lifecycle:review
  completed: "Done"
  cancelled: "Cancelled"

# Bloodbank wiring (consumed + produced subjects).
bloodbank:
  subscribe:
    # Non-functional: the repo name sits in the grammar's entity slot, which
    # real repo events fill with task/board/decision/intake/maintenance. Left
    # as-is pending the optional scope-tail phase; do not improvise a scope.
    - "bloodbank.evt.repo.bloodbank.>"
    - "bloodbank.cmd.agent.invocation.start"
  producer: "hermes-agent:bloodbank-pm"

# Runtime repo (git-tracked HERMES_HOME, auto-checkpointed).
runtime:
  github_repo: "delorenj/agent-hm-bloodbank-pm"
  submodule_path: "./runtime"
  checkpoint:
    cadence: "hourly"
    on_session_end: true

