# event-toaster — standalone compose
#
# Joins the existing bloodbank-network, subscribes to every `bloodbank.evt.>`
# envelope — the version-free grammar, matching SUBJECT_FILTER below and the
# running container — and toasts the ones worth a person's attention at
# ntfy.delo.sh. hook-hub state pulses are muted, tool calls are rolled into a
# periodic low-priority digest, and individual toasts are rate-limited, because
# forwarding all of it 429'd ntfy for every publisher on the host (see main.py). There is no contract-version token in a
# subject; the retired `bloodbank.evt.v1.>` wildcard named here would have
# matched nothing that is published today.
# Independent of the broader bloodbank compose lifecycle.
# NTFY_TOKEN is required now that ntfy is auth-default-access=deny-all; supply it
# via BLOODBANK_TOASTER_NTFY_TOKEN in the environment (never commit the token).
#
# Bring up:
#   docker compose --project-name bloodbank-toaster \
#     -f services/event-toaster/docker-compose.yml \
#     up -d --build
#
# Tear down:
#   docker compose --project-name bloodbank-toaster \
#     -f services/event-toaster/docker-compose.yml \
#     down

name: bloodbank-toaster

networks:
  bloodbank-network:
    external: true

services:
  event-toaster:
    build:
      context: .
    container_name: bloodbank-event-toaster
    environment:
      NATS_URL: "nats://nats:4222"
      SUBJECT_FILTER: "${BLOODBANK_TOASTER_SUBJECT:-bloodbank.evt.>}"
      NTFY_URL: "${BLOODBANK_TOASTER_NTFY_URL:-https://ntfy.delo.sh}"
      NTFY_TOPIC: "${BLOODBANK_TOASTER_NTFY_TOPIC:-bloodbank}"
      NTFY_PRIORITY: "${BLOODBANK_TOASTER_NTFY_PRIORITY:-5}"
      NTFY_TAGS: "${BLOODBANK_TOASTER_NTFY_TAGS:-drop_of_blood,zap}"
      NTFY_TOKEN: "${BLOODBANK_TOASTER_NTFY_TOKEN:-}"
      MAX_BODY_CHARS: "${BLOODBANK_TOASTER_MAX_BODY_CHARS:-400}"
      # `-` not `:-`: an explicitly empty value turns the list off.
      TOASTER_MUTE_TYPES: "${BLOODBANK_TOASTER_MUTE_TYPES-bloodbank.agent.hook.updated,bloodbank.system.hook.updated}"
      TOASTER_DIGEST_TYPES: "${BLOODBANK_TOASTER_DIGEST_TYPES-bloodbank.agent.tool.*}"
      TOAST_RATE_PER_MIN: "${BLOODBANK_TOASTER_RATE_PER_MIN:-20}"
      TOAST_BURST: "${BLOODBANK_TOASTER_BURST:-10}"
      TOAST_PER_TYPE_PER_MIN: "${BLOODBANK_TOASTER_PER_TYPE_PER_MIN:-6}"
      TOAST_PER_TYPE_BURST: "${BLOODBANK_TOASTER_PER_TYPE_BURST:-3}"
      DIGEST_SECONDS: "${BLOODBANK_TOASTER_DIGEST_SECONDS:-300}"
      LOG_LEVEL: "${BLOODBANK_TOASTER_LOG_LEVEL:-INFO}"
    networks:
      - bloodbank-network
    restart: unless-stopped
