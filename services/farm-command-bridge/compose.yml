# farm-command-bridge: the Farm's signed commands (Create Invoice, the palette) and Mercury's transaction
# webhooks (mercury-hooks.delo.sh, Milkshake Story 9.6) -> BLOODBANK_COMMANDS.
# Start (secrets resolved into this process only):
#   op run --env-file .env.op -- docker compose --env-file /dev/null up -d --build
name: bloodbank-farm-command-bridge
services:
  farm-command-bridge:
    image: bloodbank-farm-command-bridge:local
    build:
      context: ../..
      dockerfile: services/farm-command-bridge/Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://bloodbank-nats:4222
      FARM_COMMAND_KEYS: ${FARM_COMMAND_KEYS:?FARM_COMMAND_KEYS comes from .env.op via op run}
      # Mercury webhook endpoints (contract 16.3.1), optional: with none, POST /v1/mercury-webhooks
      # answers 503 HOOK_UNCONFIGURED and the Farm routes are unaffected. _2 only during a rotation.
      MERCURY_WEBHOOK_ENDPOINT_1: ${MERCURY_WEBHOOK_ENDPOINT_1:-}
      MERCURY_WEBHOOK_SECRET_1: ${MERCURY_WEBHOOK_SECRET_1:-}
      MERCURY_WEBHOOK_ENDPOINT_2: ${MERCURY_WEBHOOK_ENDPOINT_2:-}
      MERCURY_WEBHOOK_SECRET_2: ${MERCURY_WEBHOOK_SECRET_2:-}
    volumes: [farm-command-archive:/data]
    networks: [bloodbank-network, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.farm-commands.rule: Host(`farm-commands.delo.sh`)
      traefik.http.routers.farm-commands.entrypoints: websecure
      traefik.http.routers.farm-commands.tls.certresolver: letsencrypt
      traefik.http.services.farm-commands.loadbalancer.server.port: "8080"
      # Mercury's webhooks: their own host and path on the same container and service. The handler
      # also refuses the path on any other Host, and the Farm paths on this one.
      traefik.http.routers.mercury-hooks.rule: Host(`mercury-hooks.delo.sh`) && Path(`/v1/mercury-webhooks`)
      traefik.http.routers.mercury-hooks.entrypoints: websecure
      traefik.http.routers.mercury-hooks.tls.certresolver: letsencrypt
      traefik.http.routers.mercury-hooks.service: farm-commands
    # Liveness only: /healthz answers 200 whenever the process serves (readiness, NATS connected
    # and archive drained, is in its body and on /readyz). A NATS blip must not mark the container
    # unhealthy, or Traefik stops routing and the Farm gets a 404 instead of 503 BUS_UNAVAILABLE.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik routes only to a healthy container: probe every 2 s while starting, so a restart
      # is routable within seconds rather than after the first 30 s interval.
      start_period: 30s
      start_interval: 2s
volumes:
  farm-command-archive:
networks:
  bloodbank-network:
    external: true
  proxy:
    external: true
