# Synthetic probe is opt-in via --targets or TARGET_WATCH_PATHS and has no
# outbound channel by default. Detection/routed facts remain inspectable locally.
[target]
id = "watch-selftest"
display_name = "Watch Selftest"

[target.handles]
email = ["watch-selftest@delo.sh"]
label = ["Watch Selftest"]

[sink]
kind = "notify_only"
# No notify channel: this is a synthetic probe, not an operator escalation.
