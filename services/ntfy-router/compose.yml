# ntfy-router — standalone compose
#
# Joins the existing bloodbank-network, subscribes to every `bloodbank.evt.>`
# envelope — the version-free grammar, matching SUBJECT_FILTER below and the
# running container — and routes the ones worth a person's attention at
# ntfy.delo.sh. hook-hub state pulses are muted, tool calls are rolled into a
# periodic low-priority digest, and individual routes are rate-limited, because
# forwarding all of it 429'd ntfy for every publisher on the host (see main.py).
# Deployment events are loud: they skip the rate limits, and their data.links
# become ntfy buttons. There is no contract-version token in a subject; the
# retired `bloodbank.evt.v1.>` wildcard would have matched nothing that is
# published today.
# Independent of the broader bloodbank compose lifecycle.
# NTFY_TOKEN is required now that ntfy is auth-default-access=deny-all; supply it
# via BLOODBANK_NTFY_ROUTER_NTFY_TOKEN in the environment of the one compose
# command (never commit the token).
#
# Bring up (from this directory):
#   BLOODBANK_NTFY_ROUTER_NTFY_TOKEN="$(op read 'op://DeLoSecrets/ntfy Access Token/credential')" \
#     docker compose -f compose.yml up -d --build
#
# Tear down:
#   docker compose -f compose.yml down

name: bloodbank-ntfy-router

networks:
  bloodbank-network:
    external: true

services:
  ntfy-router:
    build:
      context: .
    container_name: bloodbank-ntfy-router
    environment:
      NATS_URL: "nats://nats:4222"
      SUBJECT_FILTER: "${BLOODBANK_NTFY_ROUTER_SUBJECT:-bloodbank.evt.>}"
      NTFY_URL: "${BLOODBANK_NTFY_ROUTER_NTFY_URL:-https://ntfy.delo.sh}"
      NTFY_TOPIC: "${BLOODBANK_NTFY_ROUTER_NTFY_TOPIC:-bloodbank}"
      # Deployments are also published here: the upstream gate forwards it, so ntfy-ios wakes (`-`: empty turns it off).
      NTFY_DEPLOY_TOPIC: "${BLOODBANK_NTFY_ROUTER_DEPLOY_TOPIC-deploys}"
      NTFY_PRIORITY: "${BLOODBANK_NTFY_ROUTER_NTFY_PRIORITY:-5}"
      NTFY_TAGS: "${BLOODBANK_NTFY_ROUTER_NTFY_TAGS:-drop_of_blood,zap}"
      NTFY_TOKEN: "${BLOODBANK_NTFY_ROUTER_NTFY_TOKEN:-}"
      MAX_BODY_CHARS: "${BLOODBANK_NTFY_ROUTER_MAX_BODY_CHARS:-400}"
      # `-` not `:-`: an explicitly empty value turns the list off.
      NTFY_ROUTER_MUTE_TYPES: "${BLOODBANK_NTFY_ROUTER_MUTE_TYPES-bloodbank.agent.hook.updated,bloodbank.system.hook.updated}"
      NTFY_ROUTER_DIGEST_TYPES: "${BLOODBANK_NTFY_ROUTER_DIGEST_TYPES-bloodbank.agent.tool.*}"
      # Skip the per-type cap and the shared bucket (still wait out ntfy pushback).
      NTFY_ROUTER_LOUD_TYPES: "${BLOODBANK_NTFY_ROUTER_LOUD_TYPES-bloodbank.project.deployment.*}"
      ROUTE_RATE_PER_MIN: "${BLOODBANK_NTFY_ROUTER_RATE_PER_MIN:-20}"
      ROUTE_BURST: "${BLOODBANK_NTFY_ROUTER_BURST:-10}"
      ROUTE_PER_TYPE_PER_MIN: "${BLOODBANK_NTFY_ROUTER_PER_TYPE_PER_MIN:-6}"
      ROUTE_PER_TYPE_BURST: "${BLOODBANK_NTFY_ROUTER_PER_TYPE_BURST:-3}"
      DIGEST_SECONDS: "${BLOODBANK_NTFY_ROUTER_DIGEST_SECONDS:-300}"
      LOG_LEVEL: "${BLOODBANK_NTFY_ROUTER_LOG_LEVEL:-INFO}"
    networks:
      - bloodbank-network
    restart: unless-stopped
