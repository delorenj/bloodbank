# hook-hub handler registry — THE ONE FILE YOU EDIT.
#
# Every agent CLI reaches this registry through the same `bb-hook` re-trigger, so
# a handler bound to a lifecycle role here fires for claude, codex, copilot,
# hermes and antigravity alike. Adding a concern is one row, not six edits across
# five config dialects.
#
# Fields
#   id           unique, stable; appears in the hub log and the reply's `handled`
#   mode         "sync"  -> stdout is returned to the CLI and injected into the
#                           prompt; shares one budget (HOOK_HUB_SYNC_BUDGET)
#                "async" -> launched and forgotten; stdout discarded
#   on           lifecycle roles, from hooks.master.json — the portable binding:
#                session_start, prompt_submit, pre_tool, post_tool,
#                subagent_stop, session_end, invocation_start, invocation_failed
#   on_native    native event names, for signals with no contract-legal event
#                type (Notification, PermissionRequest, TeammateIdle). These
#                dispatch to handlers but are never published to the bus.
#   command      argv list; ~ is expanded. No shell, so no pipes or $VARS.
#   timeout_ms   hard kill deadline for this handler
#   match_tool   regex against payload tool_name (post_tool / pre_tool only)
#   require_env  skip silently unless every listed var is set and non-empty.
#                This is what makes a zellij handler correct in a bare terminal
#                instead of noisy.
#   order        sync execution order (low first); async order is unspecified
#   enabled      false parks a row without deleting it
#
# Handlers inherit the hub's environment plus the caller's captured context
# (ZELLIJ_*, TERM) and run with cwd set to the agent's working directory.
# BB_HOOK_CLI / BB_HOOK_NATIVE / BB_HOOK_ROLE are exported for handlers that
# want to know who triggered them. BB_HOOK_HUB=off is exported too, so a handler
# that re-enters an agent CLI cannot recurse back into the hub.
#
# Everything below is commented out. Rows are enabled one at a time during the
# cutover, and in the SAME commit that removes the concern's old native wiring —
# never both live at once. See docs/hook-hub-plan.md.

