name: bloodbank-platform
label: Bloodbank
kind: platform
version: 0.1.0
description: >
  Shared host-level Hermes gateway for canonical Bloodbank agent invocation
  commands. Routes authenticated command targets to isolated Hermes profiles.
author: 33GOD
optional_env:
  - name: BLOODBANK_NATS_URL
    description: "NATS endpoint; defaults to nats://127.0.0.1:4222"
    prompt: "NATS URL"
    password: false
  - name: BLOODBANK_NATS_CREDS
    description: "Path to a NATS credentials file"
    prompt: "NATS credentials file"
    password: true

